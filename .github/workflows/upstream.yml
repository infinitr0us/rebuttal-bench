name: upstream

# Has openreview-web changed anything the page mirrors (Marked, DOMPurify and
# MathJax versions and settings, the renderer, the note styles)? The preview
# is only faithful while the snapshot matches, and between rebuttal seasons
# nobody runs the check by hand. A change opens an issue (or refreshes the
# open one); a failed check fails the run, which GitHub reports by e-mail.
# GitHub turns scheduled workflows off after 60 days without a commit: turn it
# back on in the Actions tab.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The script needs no npm packages, only Node's fetch.
      - name: Compare openreview-web with the snapshot
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/check-upstream.mjs > report.txt 2>&1
          code=$?
          cat report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 nothing changed, 1 something changed (next step), 2 the check failed.
          if [ "$code" -eq 2 ]; then exit 1; fi
          exit 0
      - name: Open or refresh the drift issue
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly \`check-upstream\` run found a change in what the page mirrors ([run]($RUN_URL), $(date -u +%Y-%m-%d))."
            echo
            echo '````'
            cat report.txt
            echo '````'
            echo
            echo 'Bring the page and `tests/lib/pipeline.js` in line, run `npm test`, then `npm run check-upstream -- --update` (AGENTS.md, "Staying in sync with OpenReview"). Close this issue once the snapshot is updated.'
          } > body.md
          gh label create upstream-drift --color d93f0b --description "openreview-web changed what the page mirrors" --force
          open=$(gh issue list --label upstream-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            # Refresh the body only: a weekly comment would notify everyone each Monday.
            gh issue edit "$open" --body-file body.md
          else
            gh issue create --title "openreview-web changed what the page mirrors" --label upstream-drift --body-file body.md
          fi
